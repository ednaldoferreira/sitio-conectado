{% extends 'base.html' %}
{% block title %}Criar Conta — Sítio Conectado{% endblock %}
{% block content %}
<div style="min-height:75vh;display:flex;align-items:center;justify-content:center;padding:2rem 0;">
<div style="width:100%;max-width:520px;">

  <div style="text-align:center;margin-bottom:2rem;">
    <div style="width:64px;height:64px;background:var(--verde);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 1rem;">🌱</div>
    <h1 style="font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--verde);margin-bottom:.3rem;">Criar conta</h1>
    <p style="color:var(--texto-sub);font-size:.9rem;">Junte-se ao portal do produtor rural de Sítio Novo</p>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="form-group">
          <label class="label">Nome completo</label>
          <input type="text" name="nome" class="input" placeholder="Seu nome completo" required>
        </div>
        <div class="row2">
          <div class="form-group">
            <label class="label">E-mail</label>
            <input type="email" name="email" class="input" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label class="label">Telefone</label>
            <input type="text" name="telefone" class="input" placeholder="(99) 99999-9999">
          </div>
        </div>
        <div class="form-group">
          <label class="label">Senha</label>
          <input type="password" name="senha" class="input" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div class="form-group">
          <label class="label">Tipo de conta</label>
          <div class="radio-group">
            <div class="radio-card" style="flex:1">
              <input type="radio" name="tipo" value="consumidor" id="cons" checked>
              <label for="cons"><i class="bi bi-bag-heart" style="font-size:1.1rem"></i> Consumidor</label>
            </div>
            <div class="radio-card" style="flex:1">
              <input type="radio" name="tipo" value="produtor" id="prod">
              <label for="prod"><i class="bi bi-tree" style="font-size:1.1rem"></i> Produtor Rural</label>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-green btn-full" style="padding:13px;margin-top:.25rem;">
          <i class="bi bi-check-circle"></i> Criar minha conta
        </button>
      </form>
      <div class="divider"></div>
      <p style="text-align:center;font-size:.875rem;color:var(--texto-sub);">
        Já tem conta? <a href="{{ url_for('login') }}" style="color:var(--verde);font-weight:600;text-decoration:none;">Faça login</a>
      </p>
    </div>
  </div>

</div>
</div>
{% endblock %}
